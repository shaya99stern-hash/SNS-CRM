<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#005b93" />
    <title>SNS Leads</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg?v=20260504-15" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon.svg?v=20260504-15" />
    <link rel="stylesheet" href="./styles.css?v=20260504-15" />
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div class="brand">
          <img src="./assets/icon.svg?v=20260504-15" alt="The Water Scrooge" width="54" height="54" />
          <div>
            <strong>SNS Leads</strong>
            <span>The Water Scrooge</span>
          </div>
        </div>
        <div class="masthead-stats">
          <span>Clients</span>
          <strong id="totalCount">0</strong>
        </div>
      </header>

      <section class="content-shell">
        <section class="topbar" aria-label="CRM controls">
          <div>
            <h1 id="pageTitle">Clients</h1>
          </div>
          <div class="topbar-actions">
            <label class="search-field">
              <input id="searchInput" type="search" placeholder="Search clients, contacts, buildings, notes" autocomplete="off" />
            </label>
            <button id="refreshBtn" class="secondary-btn refresh-action" type="button" aria-label="Refresh latest changes">
              ↻ Refresh
            </button>
            <button id="addClientBtn" class="primary-btn add-client-action" type="button">
              <span aria-hidden="true">+</span>
              Add client
            </button>
            <button id="addBuildingBtn" class="primary-btn add-building-action" type="button" hidden>
              <span aria-hidden="true">+</span>
              Add building
            </button>
          </div>
        </section>

        <nav class="tabbar" aria-label="CRM sections">
          <button class="tab-btn is-active" type="button" data-view="clients">Clients</button>
          <button class="tab-btn" type="button" data-view="buildings">Buildings</button>
        </nav>

        <section class="summary-grid compact-summary" aria-label="Pipeline summary">
          <article class="summary-card">
            <span>Clients</span>
            <strong id="clientMetric">0</strong>
          </article>
          <article class="summary-card">
            <span>Buildings</span>
            <strong id="buildingMetric">0</strong>
          </article>
        </section>

        <section id="clientsView" class="view is-visible" aria-label="Clients">
          <div id="clientList" class="card-list"></div>
          <div id="clientEmptyState" class="empty-state" hidden>
            <strong>No clients yet</strong>
            <span>Add the parent company/client first. Then add buildings under that client.</span>
          </div>
        </section>

        <section id="buildingsView" class="view" aria-label="Buildings">
          <div id="buildingList" class="card-list"></div>
          <div id="buildingEmptyState" class="empty-state" hidden>
            <strong>No buildings yet</strong>
            <span>Open a client and add buildings/properties under that parent client.</span>
          </div>
        </section>
      </section>
    </main>

    <dialog id="clientDialog">
      <form id="clientForm" method="dialog">
        <div class="dialog-head">
          <h2 id="clientDialogTitle">Add client</h2>
          <button class="icon-btn close-dialog" type="button" aria-label="Close">x</button>
        </div>

        <input id="clientId" type="hidden" />
        <div class="form-grid">
          <label>
            Client / parent company
            <input id="companyInput" required maxlength="120" autocomplete="organization" />
          </label>
          <label>
            Contact person
            <input id="contactInput" maxlength="120" autocomplete="name" />
          </label>
          <label>
            Phone
            <input id="phoneInput" maxlength="40" autocomplete="tel" />
          </label>
          <label>
            Email
            <input id="emailInput" type="email" maxlength="160" autocomplete="email" />
          </label>
          <label>
            Client status
            <select id="statusInput">
              <option>Prospective</option>
              <option>Meeting scheduled</option>
              <option>Met</option>
              <option>Follow up</option>
              <option>Need next step</option>
              <option>Closed</option>
              <option>No close</option>
            </select>
          </label>
          <label>
            Meeting date
            <input id="meetingDateInput" type="date" />
          </label>
          <label>
            Meeting owner
            <input id="meetingOwnerInput" maxlength="80" placeholder="Dan, Jack, etc." />
          </label>
          <label>
            Next step
            <input id="nextStepInput" maxlength="180" placeholder="What has to happen next?" />
          </label>
          <label class="notes-label">
            Follow up / comment
            <textarea id="followUpInput" rows="4" maxlength="2000" placeholder="Follow-up notes, comments, reminders, what was said."></textarea>
          </label>
          <label class="notes-label">
            Close / no close
            <input id="closeStatusInput" maxlength="160" placeholder="Closed, no close, still open, reason, etc." />
          </label>
          <label class="notes-label">
            Client notes
            <textarea id="notesInput" rows="5" maxlength="2000" placeholder="Where are we holding with this client?"></textarea>
          </label>
        </div>

        <div class="dialog-actions">
          <button id="deleteClientBtn" class="danger-btn" type="button">Delete client</button>
          <span></span>
          <button class="secondary-btn close-dialog" type="button">Cancel</button>
          <button id="saveClientBtn" class="primary-btn" value="default" type="submit">Save client</button>
        </div>
      </form>
    </dialog>

    <dialog id="buildingDialog">
      <form id="buildingForm" method="dialog">
        <div class="dialog-head">
          <h2 id="buildingDialogTitle">Add building</h2>
          <button class="icon-btn close-dialog" type="button" aria-label="Close">x</button>
        </div>

        <input id="buildingId" type="hidden" />
        <div class="form-grid">
          <label>
            Parent client
            <select id="buildingClientInput" required></select>
          </label>
          <label>
            Building / property name
            <input id="buildingNameInput" required maxlength="160" />
          </label>
          <label class="notes-label">
            Address
            <input id="buildingAddressInput" maxlength="220" />
          </label>
          <label>
            Building status
            <select id="buildingStatusInput">
              <option>Prospective</option>
              <option>Need contact</option>
              <option>Need bills</option>
              <option>Follow up</option>
              <option>Contract sent</option>
              <option>Contract signed</option>
              <option>Installation started</option>
              <option>Installation done</option>
              <option>Dead / not a fit</option>
            </select>
          </label>
          <label>
            Description
            <input id="buildingDescriptionInput" maxlength="120" placeholder="83-room property, 70-unit property, etc." />
          </label>
          <label class="notes-label">
            Building notes
            <textarea id="buildingNotesInput" rows="6" maxlength="3000" placeholder="Where are we holding with this building? Water bills, contact attempts, contract status, install notes, blockers, next step."></textarea>
          </label>
        </div>

        <div class="dialog-actions">
          <button id="deleteBuildingBtn" class="danger-btn" type="button">Delete building</button>
          <span></span>
          <button class="secondary-btn close-dialog" type="button">Cancel</button>
          <button id="saveBuildingBtn" class="primary-btn" value="default" type="submit">Save building</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js?v=20260504-15" type="module"></script>
  </body>
</html>
