<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#153d35" />
    <title>SNS CRM</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="masthead">
        <div class="brand">
          <img src="./assets/icon.svg" alt="" width="40" height="40" />
          <div>
            <strong>SNS CRM</strong>
            <span>Supply Net Solutions</span>
          </div>
        </div>
        <div class="masthead-stats">
          <span>Clients</span>
          <strong id="totalCount">0</strong>
        </div>
      </header>

      <section class="content-shell">
        <section class="topbar" aria-label="CRM controls">
          <div>
            <p class="eyebrow">SNS account desk</p>
            <h1>Clients</h1>
          </div>
          <div class="topbar-actions">
            <label class="search-field">
              <span aria-hidden="true">?</span>
              <input id="searchInput" type="search" placeholder="Search clients, contacts, notes" autocomplete="off" />
            </label>
            <button id="addClientBtn" class="primary-btn" type="button">
              <span aria-hidden="true">+</span>
              Add client
            </button>
          </div>
        </section>

        <section id="pipelineView" class="view is-visible" aria-label="Clients">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Company</th>
                  <th>Notes</th>
                  <th>Contact</th>
                  <th>Phone</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Updated</th>
                  <th aria-label="Actions"></th>
                </tr>
              </thead>
              <tbody id="clientRows"></tbody>
            </table>
            <div id="emptyState" class="empty-state" hidden>
              <strong>No clients yet</strong>
              <span>Add the first SNS opportunity when you are ready.</span>
            </div>
          </div>
        </section>
      </section>
    </main>

    <dialog id="clientDialog">
      <form id="clientForm" method="dialog">
        <div class="dialog-head">
          <h2 id="dialogTitle">Add client</h2>
          <button class="icon-btn close-dialog" type="button" aria-label="Close">x</button>
        </div>

        <input id="clientId" type="hidden" />
        <div class="form-grid">
          <label>
            Company name
            <input id="companyInput" required maxlength="120" autocomplete="organization" />
          </label>
          <label>
            Contact person
            <input id="contactInput" maxlength="120" autocomplete="name" />
          </label>
          <label>
            Phone
            <input id="phoneInput" maxlength="40" autocomplete="tel" />
          </label>
          <label>
            Email
            <input id="emailInput" type="email" maxlength="160" autocomplete="email" />
          </label>
          <label>
            Status
            <select id="statusInput">
              <option>Had initial meeting</option>
              <option>Interested</option>
              <option>Follow up</option>
              <option>Sent contract</option>
              <option>Contract signed</option>
              <option>Installation started</option>
              <option>Installation done</option>
            </select>
          </label>
          <label class="notes-label">
            Notes
            <textarea id="notesInput" rows="5" maxlength="2000"></textarea>
          </label>
        </div>

        <div class="dialog-actions">
          <button id="deleteClientBtn" class="danger-btn" type="button">Delete</button>
          <span></span>
          <button class="secondary-btn close-dialog" type="button">Cancel</button>
          <button id="saveClientBtn" class="primary-btn" value="default" type="submit">Save client</button>
        </div>
      </form>
    </dialog>

    <template id="rowTemplate">
      <tr class="client-row">
        <td data-label="Company" class="company-cell">
          <button class="row-link company-name" type="button"></button>
        </td>
        <td data-label="Notes" class="notes-cell"></td>
        <td data-label="Contact" class="contact-cell"></td>
        <td data-label="Phone" class="phone-cell"></td>
        <td data-label="Email" class="email-cell"></td>
        <td data-label="Status"><span class="status-pill"></span></td>
        <td data-label="Updated" class="updated-cell"></td>
        <td class="action-cell">
          <button class="icon-btn edit-btn" type="button" aria-label="Edit client">Edit</button>
        </td>
      </tr>
    </template>

    <script src="./app.js" type="module"></script>
  </body>
</html>
